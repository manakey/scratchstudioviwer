<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スタジオビュワー (Scratch API)</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf0f9;--panel:#fff;--ink:#1c2442;--sub:#5d6788;--line:#d3dcef;--blue:#4d97ff;--orange:#ffab19;--err:#c8321e}
@media(prefers-color-scheme:dark){:root{--bg:#141a2e;--panel:#1d2540;--ink:#eaf0ff;--sub:#9aa6cc;--line:#2d3860}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic",system-ui,sans-serif;line-height:1.6}
header{padding:28px 20px 20px;max-width:1100px;margin:auto}
h1{font-size:2rem;font-weight:900;margin:0 0 14px;letter-spacing:.02em}
h1 span{background:var(--orange);color:#1c2442;padding:0 .35em;border-radius:6px}
form{display:flex;gap:8px;flex-wrap:wrap}
input,select,button{font:inherit;color:inherit}
input,select{border:2px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button{border:0;background:var(--blue);color:#fff;font-weight:700;border-radius:10px;padding:8px 18px;cursor:pointer}
button.ghost{background:var(--panel);color:var(--ink);border:2px solid var(--line)}
button:disabled{opacity:.5;cursor:default}
main{max-width:1100px;margin:auto;padding:0 20px 60px}
.info{background:var(--panel);border-radius:16px;padding:18px 20px;margin-bottom:16px;border-left:8px solid var(--orange)}
.info h2{margin:0 0 4px;font-size:1.4rem}
.info p{margin:4px 0;color:var(--sub);white-space:pre-wrap}
.meta{font-size:.9rem;color:var(--sub)}
.tabs{display:flex;gap:6px;margin:16px 0 12px}
.tabs button{background:var(--panel);color:var(--sub);border:2px solid var(--line)}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--panel);border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;display:block;border:2px solid transparent}
.card:hover{border-color:var(--blue)}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--line)}
.card div{padding:8px 12px 10px}
.card b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card small{color:var(--sub)}
.list{display:flex;flex-direction:column;gap:10px}
.row{background:var(--panel);border-radius:12px;padding:10px 14px;display:flex;gap:12px}
.row img{width:40px;height:40px;border-radius:50%;flex:none;background:var(--line)}
.row .reply{margin-top:8px;padding-left:12px;border-left:3px solid var(--line)}
.users{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.users a{background:var(--panel);border-radius:12px;padding:10px;display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;font-weight:700}
.users img{width:36px;height:36px;border-radius:50%}
.msg{padding:14px;border-radius:12px;background:var(--panel)}
.msg.err{color:var(--err);border:2px solid var(--err)}
.more{margin:18px auto 0;display:block}
</style>
</head>
<body>
<header>
  <h1><span>Scratch</span> スタジオビュワー</h1>
  <form id="f">
    <input id="sid" inputmode="numeric" placeholder="スタジオID または URL" aria-label="スタジオID" size="30" required>
    <button>表示する</button>
  </form>
</header>
<main id="app"><div class="msg">スタジオのIDかURLを入力してください。例: 27003594</div></main>

<script>
const API = "https://api.scratch.mit.edu";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const img = u => !u ? "" : u.startsWith("//") ? "https:" + u : u;
const fmt = d => d ? new Date(d).toLocaleDateString("ja-JP") : "-";

let state;

async function api(path) {
  const r = await fetch(API + path);
  if (!r.ok) throw new Error(r.status === 404 ? "スタジオが見つかりません (404)" : "APIエラー: " + r.status);
  return r.json();
}

function parseId(v) {
  const m = v.match(/studios\/(\d+)/) || v.match(/^\s*(\d+)\s*$/);
  return m ? m[1] : null;
}

$("#f").addEventListener("submit", e => {
  e.preventDefault();
  const id = parseId($("#sid").value);
  if (!id) return show('<div class="msg err">IDの形式が正しくありません。数字かスタジオのURLを入力してください。</div>');
  load(id);
});

function show(html) { $("#app").innerHTML = html; }

async function load(id) {
  show('<div class="msg">読み込み中…</div>');
  try {
    const info = await api(`/studios/${id}`);
    state = { id, info, tab: "projects", projects: [], offset: 0, done: false, sort: "new", q: "" };
    history.replaceState(null, "", "#" + id);
    render();
    await moreProjects();
  } catch (err) {
    show(`<div class="msg err">${esc(err.message)}<br>ネットワークに接続した状態で、このHTMLファイルをブラウザで直接開いて実行してください。</div>`);
  }
}

function render() {
  const i = state.info, s = i.stats || {};
  show(`
  <section class="info">
    <h2>${esc(i.title)}</h2>
    <p class="meta">作成 ${fmt(i.history?.created)} ・ 更新 ${fmt(i.history?.modified)} ・ コメント ${s.comments ?? "-"} ・ フォロワー ${s.followers ?? "-"} ・ 管理者 ${s.managers ?? "-"}</p>
    <p>${esc(i.description)}</p>
    <p><a href="https://scratch.mit.edu/studios/${state.id}/" target="_blank" rel="noopener">Scratchで開く</a></p>
  </section>
  <div class="tabs" role="tablist">
    ${[["projects","作品"],["comments","コメント"],["curators","キュレーター"],["managers","管理者"]]
      .map(([k,l]) => `<button role="tab" data-t="${k}" aria-selected="${state.tab===k}">${l}</button>`).join("")}
  </div>
  <div id="pane"></div>`);
  document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { state.tab = b.dataset.t; render(); paneLoad(); });
  paneLoad();
}

function paneLoad() {
  const p = $("#pane");
  if (state.tab === "projects") return drawProjects();
  if (state.tab === "comments") return loadComments();
  loadUsers(state.tab);
}

/* 作品 */
async function moreProjects() {
  const btn = $("#moreBtn"); if (btn) btn.disabled = true;
  try {
    const list = await api(`/studios/${state.id}/projects?limit=40&offset=${state.offset}`);
    state.projects.push(...list);
    state.offset += list.length;
    if (list.length < 40) state.done = true;
  } catch (e) { state.done = true; }
  if (state.tab === "projects") drawProjects();
}

function drawProjects() {
  let list = state.projects.filter(p =>
    (p.title + " " + (p.username || p.creator?.username || "")).toLowerCase().includes(state.q.toLowerCase()));
  if (state.sort === "old") list = [...list].reverse();
  if (state.sort === "title") list = [...list].sort((a, b) => a.title.localeCompare(b.title, "ja"));
  $("#pane").innerHTML = `
    <div class="tools">
      <input id="q" placeholder="タイトル・作者で絞り込み" value="${esc(state.q)}" aria-label="絞り込み">
      <select id="sort" aria-label="並び順">
        <option value="new">追加が新しい順</option><option value="old">追加が古い順</option><option value="title">タイトル順</option>
      </select>
      <span class="meta" style="align-self:center">${list.length} 件を表示 (取得済み ${state.projects.length} 件)</span>
    </div>
    <div class="grid">${list.map(p => `
      <a class="card" href="https://scratch.mit.edu/projects/${p.id}/" target="_blank" rel="noopener">
        <img loading="lazy" alt="" src="https://uploads.scratch.mit.edu/get_image/project/${p.id}_480x360.png">
        <div><b>${esc(p.title)}</b><small>${esc(p.username || p.creator?.username || "")}</small></div>
      </a>`).join("")}</div>
    ${state.done ? "" : '<button class="ghost more" id="moreBtn">さらに読み込む</button>'}`;
  $("#sort").value = state.sort;
  $("#q").oninput = e => { state.q = e.target.value; const pos = e.target.selectionStart; drawProjects(); const q = $("#q"); q.focus(); q.setSelectionRange(pos, pos); };
  $("#sort").onchange = e => { state.sort = e.target.value; drawProjects(); };
  const mb = $("#moreBtn"); if (mb) mb.onclick = moreProjects;
}

/* コメント */
async function loadComments(offset = 0, append = false) {
  const pane = $("#pane");
  if (!append) pane.innerHTML = '<div class="msg">読み込み中…</div>';
  try {
    const list = await api(`/studios/${state.id}/comments?limit=20&offset=${offset}`);
    const html = await Promise.all(list.map(async c => {
      let replies = [];
      if (c.reply_count > 0) { try { replies = await api(`/studios/${state.id}/comments/${c.id}/replies?limit=40&offset=0`); } catch (e) {} }
      return commentRow(c, replies);
    }));
    const wrap = append ? $("#clist") : null;
    if (wrap) { wrap.insertAdjacentHTML("beforeend", html.join("")); $("#cmore")?.remove(); }
    else pane.innerHTML = `<div class="list" id="clist">${html.join("") || '<div class="msg">コメントはまだありません。</div>'}</div>`;
    if (list.length === 20) {
      pane.insertAdjacentHTML("beforeend", '<button class="ghost more" id="cmore">さらに読み込む</button>');
      $("#cmore").onclick = () => loadComments(offset + 20, true);
    }
  } catch (e) { pane.innerHTML = `<div class="msg err">${esc(e.message)}</div>`; }
}

function commentRow(c, replies) {
  const a = c.author || {};
  return `<div class="row"><img alt="" src="${esc(img(a.image))}"><div>
    <b>${esc(a.username)}</b> <span class="meta">${fmt(c.datetime_created)}</span>
    <div>${esc(c.content)}</div>
    ${replies.map(r => `<div class="reply"><b>${esc(r.author?.username)}</b> <span class="meta">${fmt(r.datetime_created)}</span><div>${esc(r.content)}</div></div>`).join("")}
  </div></div>`;
}

/* ユーザー */
async function loadUsers(kind) {
  const pane = $("#pane");
  pane.innerHTML = '<div class="msg">読み込み中…</div>';
  try {
    let all = [], off = 0;
    while (off < 200) {
      const l = await api(`/studios/${state.id}/${kind}?limit=40&offset=${off}`);
      all.push(...l); off += l.length;
      if (l.length < 40) break;
    }
    pane.innerHTML = all.length ? `<div class="users">${all.map(u => `
      <a href="https://scratch.mit.edu/users/${esc(u.username)}/" target="_blank" rel="noopener">
        <img alt="" src="${esc(img(u.profile?.images?.["32x32"] || `https://uploads.scratch.mit.edu/get_image/user/${u.id}_32x32.png`))}">${esc(u.username)}</a>`).join("")}</div>`
      : '<div class="msg">該当するユーザーはいません。</div>';
  } catch (e) { pane.innerHTML = `<div class="msg err">${esc(e.message)}</div>`; }
}

if (location.hash.length > 1) { $("#sid").value = location.hash.slice(1); load(parseId(location.hash.slice(1)) || ""); }
</script>
</body>
</html>
